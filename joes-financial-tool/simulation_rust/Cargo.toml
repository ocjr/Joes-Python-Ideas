[package]
name = "simulation_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "simulation_rust"
# cdylib creates a dynamic library that Python can load
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Fast random number generation
rand = "0.8"
rand_distr = "0.4"

# Parallel processing
rayon = "1.8"

# Optional: for better performance
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
